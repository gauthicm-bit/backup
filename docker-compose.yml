services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://multiverse:multiverse@db:5432/multiverse
      REDIS_URL: redis://redis:6379/0
      JOB_MODE: rq
      FRONTEND_ORIGIN: http://localhost:5173
    volumes: ["audit-data:/app/data/audits", "generator-data:/app/data/generators"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: ./backend
    command: ["uv", "run", "--no-sync", "python", "-m", "app.worker.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://multiverse:multiverse@db:5432/multiverse
      REDIS_URL: redis://redis:6379/0
      JOB_MODE: rq
    volumes: ["audit-data:/app/data/audits", "generator-data:/app/data/generators"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: multiverse
      POSTGRES_PASSWORD: multiverse
      POSTGRES_DB: multiverse
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multiverse"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  audit-data:
  generator-data:
  database:
