[project]
name = "multiverse"
version = "2.2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "arch==8.0.0",
  "fastapi==0.121.1",
  "httpx==0.28.1",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "psycopg[binary]==3.2.12",
  "pyarrow==22.0.0",
  "pydantic-settings==2.12.0",
  "python-ulid==3.1.0",
  "redis==7.0.1",
  "rq==2.6.0",
  "scipy==1.16.3",
  "sqlmodel==0.0.27",
  "sse-starlette==3.0.3",
  "uvicorn==0.38.0",
  "yfinance==0.2.66",
]
[dependency-groups]
dev = ["pytest==9.0.1", "pytest-cov==7.0.0", "ruff==0.14.5"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
